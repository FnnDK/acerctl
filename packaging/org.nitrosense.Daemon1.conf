<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the nitrosensed service) may own the name. -->
  <policy user="root">
    <allow own="org.nitrosense.Daemon1"/>
  </policy>
  <!-- Any local user may talk to it; writes are gated by polkit inside the daemon. -->
  <policy context="default">
    <allow send_destination="org.nitrosense.Daemon1"/>
    <allow receive_sender="org.nitrosense.Daemon1"/>
  </policy>
</busconfig>
