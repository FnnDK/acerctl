# DKMS build of the acerctl companion modules (packaging/deb/acerctl-dkms).
PACKAGE_NAME="acerctl"
PACKAGE_VERSION="@VERSION@"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/acer-wmi-extras modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/acer-wmi-battery modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/acer-wmi-extras clean; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/acer-wmi-battery clean"
BUILT_MODULE_NAME[0]="acer-wmi-extras"
BUILT_MODULE_LOCATION[0]="acer-wmi-extras"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="acer-wmi-battery"
BUILT_MODULE_LOCATION[1]="acer-wmi-battery"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
