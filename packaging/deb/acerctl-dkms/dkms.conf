# DKMS build of the acerctl companion modules (packaging/deb/acerctl-dkms).
PACKAGE_NAME="acerctl"
PACKAGE_VERSION="@VERSION@"
# One make for both modules (the Kbuild file next to this one): dkms adds its
# arguments after the first "make" and at the end of the line only. No CLEAN:
# dkms 3 deprecates it, and older dkms runs "make -C ... M=... clean" itself.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILT_MODULE_NAME[0]="acer-wmi-extras"
BUILT_MODULE_LOCATION[0]="acer-wmi-extras"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="acer-wmi-battery"
BUILT_MODULE_LOCATION[1]="acer-wmi-battery"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
